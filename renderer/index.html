<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Tester</title>
  <style>
    :root {
      --bg-color: #1e1e1e;
      --text-color: #e0e0e0;
      --primary-color: #007acc;
      --border-color: #3e3e42;
      --log-bg: #111;
      --error-color: #ff6b68;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background-color: var(--bg-color);
      color: var(--text-color);
      height: 100vh;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    h1 {
      margin: 0 0 10px 0;
      font-size: 24px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 15px;
      padding: 15px;
      background: #2d2d2d;
      border-radius: 8px;
    }

    .input-group {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .input-group label {
      min-width: 60px;
    }

    input, select {
      padding: 8px 12px;
      background: #3c3c3c;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      color: white;
      font-size: 14px;
      width: 100%;
    }

    input:focus, select:focus {
      outline: 2px solid var(--primary-color);
      border-color: transparent;
    }

    .button-group {
      display: flex;
      gap: 10px;
    }

    button {
      padding: 8px 16px;
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 500;
      transition: opacity 0.2s;
    }

    button:hover {
      opacity: 0.9;
    }

    button:disabled {
      background-color: #4d4d4d;
      cursor: not-allowed;
      opacity: 0.7;
    }

    button.secondary {
      background-color: #4d4d4d;
    }

    .log-container {
      flex: 1;
      background-color: var(--log-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 15px;
      overflow-y: auto;
      font-family: 'Consolas', 'Monaco', monospace;
      font-size: 13px;
      white-space: pre-wrap;
    }

    .log-entry {
      margin-bottom: 4px;
      padding-bottom: 4px;
      border-bottom: 1px solid #222;
    }

    .log-error {
      color: var(--error-color);
    }
    
    .status-bar {
      font-size: 12px;
      color: #888;
    }
  </style>
</head>
<body>
  <h1>AI Tester</h1>
  
  <div class="controls">
    <div style="display: flex; flex-direction: column; gap: 15px;">
      <div class="input-group">
        <label for="url">目标 URL:</label>
        <input type="text" id="url" value="https://www.example.com" placeholder="输入要录制的网址">
      </div>

      <div class="input-group">
        <label for="out-path">输出路径:</label>
        <input type="text" id="out-path" placeholder="留空则写入默认 generated/ 目录，可填绝对路径">
      </div>
      
      <div class="button-group">
        <button id="btn-record">开始录制</button>
        <button id="btn-stop" class="secondary" disabled>停止录制</button>
      </div>

      <div class="input-group" style="margin-top: 10px; border-top: 1px solid #3e3e42; padding-top: 15px;">
        <label for="format">生成格式:</label>
        <select id="format" style="width: 150px;">
          <option value="smart">Smart (AI)</option>
          <option value="playwright">Playwright</option>
          <option value="csv">CSV</option>
        </select>
        <button id="btn-generate" class="secondary" disabled>生成用例</button>
      </div>
    </div>
  </div>

  <div class="log-container" id="logs">
    <div class="log-entry">System ready.</div>
  </div>
  
  <div class="status-bar" id="status-bar">就绪</div>

  <script src="./renderer.js"></script>
</body>
</html>
