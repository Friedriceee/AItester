name: build-win-x64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows x64 installer
        run: npm run dist:win -- --arch=x64

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-tester-win-x64
          path: release/AI Tester-Setup-*.exe