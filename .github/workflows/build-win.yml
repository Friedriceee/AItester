name: build-win-x64

on:
  push:
    branches: [master]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'src/**'
      - 'electron/**'
      - 'renderer/**'
      - 'scripts/**'
      - '.github/workflows/build-win.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

    
      - name: Install Playwright browsers into project folder
        run: npm run pw:install

     
      - name: Build Windows x64 installer (no publish)
        run: npm run dist:win -- --x64 --publish=never

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-tester-win-x64
          path: release/AI Tester-Setup-*.exe
