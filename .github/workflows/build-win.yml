name: build-win-x64


on:
  push:
    branches: [master]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'src/**'
      - 'electron/**'
      - 'renderer/**'
      - 'scripts/**'
      - '.github/workflows/build-win.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Configure Windows for long paths
        run: |
          # Enable long path support in Windows
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force
          
          # Verify the setting
          Get-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" -Name "LongPathsEnabled"
          
          # Set Git to handle long paths
          git config --system core.longpaths true
          
          # Verify Git config
          git config --get core.longpaths

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers (Windows only)
        run: |
          # Set environment variable for long paths
          $env:PLAYWRIGHT_BROWSERS_PATH = "C:\playwright-browsers"
          # Only install Chromium for Windows, skip macOS browsers with long paths
          npx playwright install chromium

      - name: Build Windows x64 installer (no publish)
        run: |
          # Set environment variable for long paths during build
          $env:PLAYWRIGHT_BROWSERS_PATH = "C:\playwright-browsers"
          npm run build
          # Build without including problematic browser files
          npx electron-builder --win nsis --x64 --publish=never
        env:
          PLAYWRIGHT_BROWSERS_PATH: C:\playwright-browsers

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-tester-win-x64
          path: release/AI Tester-Setup-*.exe
