name: build-mac-universal

on:
  push:
    branches: [master]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'tsconfig.electron.json'
      - 'src/**'
      - 'renderer/**'
      - 'scripts/**'
      - '.github/workflows/build-mac.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20  # 推荐升级到 Node.js 20 LTS
          cache: npm

      - name: Install dependencies
        run: npm ci


      - name: Install Playwright browsers into project folder
        run: npm run pw:install

     
      - name: Verify bundled browsers exist before build
        run: |
          ls -lah playwright-browsers
          test -d playwright-browsers/chromium-1200 || (echo "chromium-1200 missing" && exit 1)

      
      - name: Build mac zip (signed & notarized)
        run: npm run dist:mac -- --arm64 --x64 --publish=never

     
      - name: Verify packaged browsers in app
        run: |
          ls -lah "release/mac-arm64/AI Tester.app/Contents/Resources" || true
          ls -lah "release/mac-arm64/AI Tester.app/Contents/Resources/playwright-browsers" || (echo "packaged playwright-browsers missing" && exit 1)

      - name: Upload mac artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-tester-mac-arm64
          path: |
            release/**/*.zip
